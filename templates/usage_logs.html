<section class="record-list" style="margin-top:24px"><h3>Usage & Decision Logs</h3><div style="overflow:auto"><table class="logs"><thead><tr><th>Time</th><th>Recording</th><th>Action</th><th>Purpose</th><th>User</th></tr></thead><tbody>{% for log in logs %}<tr><td>{{ log.created_at|date:"d M Y H:i" }}</td><td>{{ log.recording.title }}</td><td>{{ log.action }}</td><td>{{ log.purpose|default:"—" }}</td><td>{{ log.actor.username|default:"—" }}</td></tr>{% empty %}<tr><td colspan="5">No recorded usage yet.</td></tr>{% endfor %}</tbody></table></div></section>
